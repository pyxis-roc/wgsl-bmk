<!DOCTYPE html>
<html lang="en">
  <head>
    <title>WGSL Benchmarking</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="/scripts/dequantize-main.ts"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- <link rel="stylesheet" href="/styles/style.css" /> -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body class="overflow-y-scroll">
    <header>
      <nav class="navbar navbar-expand-lg bg-light border-bottom shadow-sm mx-auto">
        <div class="container-fluid">
          <a class="navbar-brand" href="%VITE_BASE_URL_PREFIX%" aria-current="true">WebGPU Benchmarking</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="%VITE_BASE_URL_PREFIX%">Home</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  id="benchmarksDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Benchmarks
                </a>
                <ul class="dropdown-menu" aria-labelledby="benchmarksDropdown">
                  <li><a class="dropdown-item nav-link" href="%VITE_BASE_URL_PREFIX%benchmarks/matmul.html">Matmul</a></li>
                  <li>
                    <a class="dropdown-item nav-link" href="%VITE_BASE_URL_PREFIX%benchmarks/dequantize.html" aria-current="true"
                      >Dequantize</a
                    >
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="container-fluid mt-3 px-4">
      <noscript>
        <div class="alert alert-danger" role="alert">
          This page requires JavaScript to run the benchmarks. Please enable JavaScript in your browser settings.
        </div>
      </noscript>
      <div class="row row-cols-md-2 row-cols-1">
        <div class="col-md-6">
          <div id="dequantize-bmk" class="card">
            <div class="card-body d-flex flex-column">
              <h3 class="card-title">Dequantize</h3>
              <p class="card-text">This benchmark executes the dequantize kernel with random values.</p>
              <div class="hstack gap-2 mt-auto">
                <label for="it" class="col-form-label fw-bold">Iterations:</label>
                <input value="100" id="it" type="number" min="1" max="10000" class="form-control w-auto" />
                <button id="dequantize-button" class="btn btn-primary">Run</button>
              </div>
            </div>
          </div>
          <div id="dequantize-result-div"></div>
        </div>
        <div class="col-md-6">
          <div id="dequantize-bmk-variant" class="card">
            <div class="card-body d-flex flex-column">
              <h3 class="card-title">Dequantize (Explicit Checks)</h3>
              <p class="card-text">
                This benchmark executes the dequantize kernel with explicit bounds checks at the top of the kernel.
              </p>
              <div class="hstack gap-2 mt-auto">
                <label for="it-variant" class="col-form-label fw-bold">Iterations:</label>
                <input value="100" id="it-variant" type="number" min="1" max="10000" class="form-control w-auto" />
                <button id="dequantize-button-variant" class="btn btn-primary">Run</button>
              </div>
            </div>
          </div>
          <div id="dequantize-result-div-variant"></div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
